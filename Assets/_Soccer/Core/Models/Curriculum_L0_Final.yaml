# Curriculum L0 diagnostic: approach and 0.75s confirmed stable possession.
# Aggregate target steps are shared by all executable workers.
behaviors:
  Soccer4v4_Base:
    trainer_type: poca
    hyperparameters:
      batch_size: 1024
      buffer_size: 20480
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2
      memory:
        sequence_length: 64
        memory_size: 128
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    checkpoint_interval: 100000
    keep_checkpoints: 6
    max_steps: 500000
    time_horizon: 128
    summary_freq: 10000

engine_settings:
  no_graphics: true
  time_scale: 10
  target_frame_rate: -1
  capture_frame_rate: 60
