# Shared Base pipeline smoke-test configuration. Team owners should edit their own Teams/<owner>/Training YAML instead.
# Owner suffixes are folder-only; keep the behavior key as Soccer4v4_Base.
# extrinsic.strength scales all Unity rewards; tune individual events in BaseRewardProfile.
# This file verifies the Trainer connection and pipeline; it is not a long performance-training configuration.
behaviors:
  Soccer4v4_Base:
    trainer_type: poca
    hyperparameters:
      batch_size: 1024
      buffer_size: 20480
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      memory:
        sequence_length: 32
        memory_size: 128
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    keep_checkpoints: 3
    max_steps: 30000
    time_horizon: 128
    summary_freq: 5000
    self_play:
      save_steps: 5000
      team_change: 10000
      swap_steps: 5000
      window: 5
      play_against_latest_model_ratio: 0.5
      initial_elo: 1200.0

engine_settings:
  no_graphics: true
  time_scale: 20
  target_frame_rate: -1
  capture_frame_rate: 60
