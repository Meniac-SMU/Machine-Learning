# L3-A strict pass then stable receiver progression, bounded 100k, 32 workers from CLI.
# Technical assistance reuses the documented L2 pass direction/support contract.
behaviors:
  Soccer4v4_Base:
    trainer_type: poca
    init_path: results/CurriculumL1-20260905-r018/Soccer4v4_Base/Soccer4v4_Base-200184.pt
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2
      memory:
        sequence_length: 64
        memory_size: 128
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    checkpoint_interval: 50000
    keep_checkpoints: 5
    max_steps: 100000
    time_horizon: 128
    summary_freq: 10000
environment_parameters:
  soccer_l2_spawn_difficulty: 1.0
  soccer_l2_waiting_assist: 0.0
  soccer_l2_pass_aim_gate: 0.0
  soccer_l2_pass_advice: 1.0
engine_settings:
  no_graphics: true
  time_scale: 10
  target_frame_rate: -1
  capture_frame_rate: 60
