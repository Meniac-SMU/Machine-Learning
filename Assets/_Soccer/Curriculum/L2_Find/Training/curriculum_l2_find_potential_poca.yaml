# r003: bounded team potential shaping, initialized from preserved r001 final.
# Moving away removes the same credit, so distance oscillation cannot farm reward.
behaviors:
  Soccer4v4_Base:
    trainer_type: poca
    init_path: results/CurriculumL2Find-20260906-r001/Soccer4v4_Base/Soccer4v4_Base-300500.pt
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 0.0001
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2
      memory:
        sequence_length: 64
        memory_size: 128
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    checkpoint_interval: 50000
    keep_checkpoints: 7
    max_steps: 500000
    time_horizon: 128
    summary_freq: 10000
engine_settings:
  no_graphics: true
  time_scale: 10
  target_frame_rate: -1
  capture_frame_rate: 60
