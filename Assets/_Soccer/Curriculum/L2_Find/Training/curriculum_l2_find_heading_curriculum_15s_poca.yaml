# r017: rehearse the measured initial-heading failure band, then consolidate on uniform 360-degree spawning.
# Actual Red contact remains the only success; no action, movement, rotation, or speed is scripted.
behaviors:
  Soccer4v4_Base:
    trainer_type: poca
    init_path: results/CurriculumL2Find-20260907-r014/Soccer4v4_Base/Soccer4v4_Base-300060.pt
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 0.00003
      beta: 0.001
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2
      memory:
        sequence_length: 64
        memory_size: 128
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    checkpoint_interval: 50000
    keep_checkpoints: 10
    max_steps: 500000
    time_horizon: 128
    summary_freq: 10000
environment_parameters:
  soccer_l2_find_near_spawn_probability: 0.0
  soccer_l2_find_maximum_initial_heading_error:
    curriculum:
      - name: front-ray-rehearsal
        completion_criteria:
          measure: progress
          behavior: Soccer4v4_Base
          threshold: 0.1
          min_lesson_length: 0
          signal_smoothing: false
        value: 60.0
      - name: side-entry-rehearsal
        completion_criteria:
          measure: progress
          behavior: Soccer4v4_Base
          threshold: 0.3
          min_lesson_length: 0
          signal_smoothing: false
        value: 100.0
      - name: blind-side-rehearsal
        completion_criteria:
          measure: progress
          behavior: Soccer4v4_Base
          threshold: 0.5
          min_lesson_length: 0
          signal_smoothing: false
        value: 140.0
      - name: uniform-360-consolidation
        value: 180.0
engine_settings:
  no_graphics: true
  time_scale: 10
  target_frame_rate: -1
  capture_frame_rate: 60
