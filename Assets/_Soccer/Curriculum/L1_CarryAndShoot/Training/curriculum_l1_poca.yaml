# Curriculum L1: initialize from the saved short-dribble model, learn finishing, then 8m carry-to-score.
# Aggregate target steps are shared by all executable workers.
behaviors:
  Soccer4v4_Base:
    trainer_type: poca
    hyperparameters:
      batch_size: 2048
      buffer_size: 40960
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2
      memory:
        sequence_length: 64
        memory_size: 128
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    checkpoint_interval: 50000
    keep_checkpoints: 21
    max_steps: 1000000
    time_horizon: 128
    summary_freq: 10000

environment_parameters:
  # POCA reward-based curriculum measures individual reward, not group success.
  # Promote by measured success over five summaries, then use the carry config.
  soccer_l1_phase: 1.0

engine_settings:
  no_graphics: true
  time_scale: 10
  target_frame_rate: -1
  capture_frame_rate: 60
