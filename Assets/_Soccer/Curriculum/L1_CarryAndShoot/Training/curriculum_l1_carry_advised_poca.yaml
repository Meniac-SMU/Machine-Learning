# Final L1: carry the ball 8m before the Neural shot advisor can activate.
behaviors:
  Soccer4v4_Base:
    trainer_type: poca
    init_path: results/CurriculumL1-20260904-r015/Soccer4v4_Base/Soccer4v4_Base-500004.pt
    hyperparameters:
      batch_size: 2048
      buffer_size: 40960
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2
      memory:
        sequence_length: 64
        memory_size: 128
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    checkpoint_interval: 50000
    keep_checkpoints: 31
    max_steps: 1000000
    time_horizon: 128
    summary_freq: 10000
environment_parameters:
  soccer_l1_phase: 2.0
  soccer_l1_alignment: 0.0
  soccer_l1_spawn_difficulty: 1.0
engine_settings:
  no_graphics: true
  time_scale: 10
  target_frame_rate: -1
  capture_frame_rate: 60
