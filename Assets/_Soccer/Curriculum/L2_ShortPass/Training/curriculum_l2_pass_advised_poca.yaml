# L2 self-caused opportunity loss diagnostic, 32 workers, bounded 100k.
# Requires opportunity-loss Player. Evaluate L2 and L1 before any extension.
behaviors:
  Soccer4v4_Base:
    trainer_type: poca
    init_path: results/CurriculumL2-20260905-r008/Soccer4v4_Base/Soccer4v4_Base-100236.pt
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2
      memory:
        sequence_length: 64
        memory_size: 128
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    checkpoint_interval: 50000
    keep_checkpoints: 15
    max_steps: 100000
    time_horizon: 128
    summary_freq: 10000
environment_parameters:
  soccer_l2_spawn_difficulty: 0.0
  soccer_l2_waiting_assist: 1.0
  soccer_l2_pass_aim_gate: 0.0
  soccer_l2_pass_advice: 1.0
engine_settings:
  no_graphics: true
  time_scale: 10
  target_frame_rate: -1
  capture_frame_rate: 60