# Defense_PJH owns this YAML, Profiles/DefenseRewardProfile.asset, and Models/*.onnx.
# Owner suffixes are folder-only; keep Soccer4v4_Defense aligned with TeamDefinition.
# extrinsic.strength scales all Unity rewards; tune individual events in DefenseRewardProfile.
behaviors:
  Soccer4v4_Defense:
    trainer_type: poca
    hyperparameters:
      batch_size: 1024
      buffer_size: 20480
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      memory:
        sequence_length: 32
        memory_size: 128
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    keep_checkpoints: 3
    max_steps: 500000
    time_horizon: 128
    summary_freq: 10000

engine_settings:
  no_graphics: true
  time_scale: 20
  target_frame_rate: -1
  capture_frame_rate: 60
