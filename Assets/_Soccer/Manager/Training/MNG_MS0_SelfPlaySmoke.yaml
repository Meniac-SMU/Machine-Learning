behaviors:
  MNG_Manager:
    trainer_type: ppo
    hyperparameters:
      batch_size: 64
      buffer_size: 256
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    max_steps: 2048
    time_horizon: 64
    summary_freq: 128
    checkpoint_interval: 256
    keep_checkpoints: 6
    self_play:
      save_steps: 128
      team_change: 512
      swap_steps: 128
      window: 5
      play_against_latest_model_ratio: 0.5
      initial_elo: 1200.0
