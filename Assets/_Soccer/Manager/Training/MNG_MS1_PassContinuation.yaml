# One bounded continuation after r006 narrowly missed the untouched v5 pass gate.
# The Pass fixture remains oversampled and all six manager commands stay available.
behaviors:
  MNG_Manager:
    trainer_type: ppo
    init_path: results/MNG_MS1-20260920-r006/MNG_Manager/MNG_Manager-30002.pt
    hyperparameters:
      batch_size: 256
      buffer_size: 4096
      learning_rate: 0.00003
      beta: 0.003
      epsilon: 0.12
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    max_steps: 15000
    time_horizon: 128
    summary_freq: 1000
    checkpoint_interval: 7500
    keep_checkpoints: 3
    threaded: false
