behaviors:
  MNG_Manager:
    trainer_type: ppo
    hyperparameters:
      batch_size: 256
      buffer_size: 4096
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    # 100k is the normal target. 120k is the conditional extension ceiling;
    # continue past 100k only under the project-wide no-exploit improvement rule.
    max_steps: 120000
    time_horizon: 128
    summary_freq: 1000
    checkpoint_interval: 20000
    keep_checkpoints: 7
    threaded: false
