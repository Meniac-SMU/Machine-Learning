# Shared Base training configuration. Team owners should edit their own Teams/<owner>/Training YAML instead.
# Owner suffixes are folder-only; keep the behavior key as Soccer4v4_Base.
# extrinsic.strength scales all Unity rewards; tune individual events in BaseRewardProfile.
behaviors:
  Soccer4v4_Base:
    trainer_type: poca
    hyperparameters:
      batch_size: 2048
      buffer_size: 40960
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2
      memory:
        sequence_length: 64
        memory_size: 128
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    self_play:
      save_steps: 50000
      team_change: 100000
      swap_steps: 50000
      window: 10
      play_against_latest_model_ratio: 0.5
      initial_elo: 1200.0
    keep_checkpoints: 5
    max_steps: 500000
    time_horizon: 128
    summary_freq: 50000

engine_settings:
  no_graphics: true
  time_scale: 10
  target_frame_rate: -1
  capture_frame_rate: 60
