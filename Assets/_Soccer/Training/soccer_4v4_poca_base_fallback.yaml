# Base fallback training: Red learns while Navy is forced to use the rule fallback.
# Owner suffixes are folder-only; keep the behavior key as Soccer4v4_Base.
# extrinsic.strength scales all Unity rewards; tune individual events in BaseRewardProfile.
behaviors:
  Soccer4v4_Base:
    trainer_type: poca
    hyperparameters:
      batch_size: 2048
      buffer_size: 40960
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2
      memory:
        sequence_length: 64
        memory_size: 128
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    checkpoint_interval: 500000
    keep_checkpoints: 12
    max_steps: 5000000
    time_horizon: 128
    summary_freq: 50000

engine_settings:
  no_graphics: true
  time_scale: 10
  target_frame_rate: -1
  capture_frame_rate: 60
