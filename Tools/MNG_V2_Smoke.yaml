behaviors:
  MNG_ManagerV2:
    trainer_type: ppo
    hyperparameters:
      batch_size: 256
      buffer_size: 4096
      learning_rate: 0.00005
      beta: 0.003
      epsilon: 0.15
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
      beta_schedule: constant
      epsilon_schedule: constant
    network_settings:
      normalize: false
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    max_steps: 16384
    time_horizon: 128
    summary_freq: 1000
    checkpoint_interval: 2048
    keep_checkpoints: 21
    threaded: false
    self_play:
      save_steps: 512
      team_change: 2048
      swap_steps: 512
      window: 30
      play_against_latest_model_ratio: 0.3
      initial_elo: 1200.0


